; One-shot P4 helper: push ESP-Hosted slave firmware to the onboard C6 over
; SDIO with Wi-Fi left off. Replaces Digital Swatch on the P4 until you flash
; that image back. The C6 keeps the new radio firmware.
[env:guition-c6-ota]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = esp32-p4_r3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = qio
board_build.partitions = ../partitions_16mb.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3
  -Wno-error
extra_scripts =
  pre:fetch_c6_fw.py
  pre:../upload_port.py
