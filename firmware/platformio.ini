[env:crowpanel_7_hmi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
; Dual OTA slots (~1.875MB each). First flash after this change must be USB.
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
build_flags =
  -I include
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
lib_deps =
  lvgl/lvgl@8.3.11
  tamctec/TAMC_GT911@^1.0.2
  moononournation/GFX Library for Arduino@1.4.9
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1

; LAN OTA: pio run -e crowpanel_7_ota -t upload --upload-port <panel-ip>
; --auth must match OTA_PASSWORD in include/secrets.h
[env:crowpanel_7_ota]
extends = env:crowpanel_7_hmi
upload_protocol = espota
upload_flags =
  --auth=change-me
