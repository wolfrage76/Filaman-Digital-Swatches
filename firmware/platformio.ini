; Stable CrowPanel build: Arduino 2.x / IDF 4.4 (no bounce buffers).
; Bounce on Arduino 3 caused vertical scroll/desync on this panel.
[env:crowpanel_7_hmi]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; CH340 bridge on this panel corrupts writes at 460800 (C100 checksum); 230400 is reliable.
upload_speed = 230400
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
build_flags =
  -I include
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_RUNNING_CORE=1
  -UARDUINO_EVENT_RUNNING_CORE
  -DARDUINO_EVENT_RUNNING_CORE=0
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
lib_deps =
  lvgl/lvgl@8.3.11
  tamctec/TAMC_GT911@^1.0.2
  moononournation/GFX Library for Arduino@1.4.9
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1

[env:crowpanel_7_ota]
extends = env:crowpanel_7_hmi
upload_protocol = espota
upload_flags =
  --auth=change-me

; Experimental: Arduino 3 / IDF 5.3 bounce buffers (caused scroll desync on this HW).
[env:crowpanel_7_bounce]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
build_flags =
  -I include
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_RUNNING_CORE=1
  -UARDUINO_EVENT_RUNNING_CORE
  -DARDUINO_EVENT_RUNNING_CORE=0
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DDISPLAY_USE_BOUNCE_BUFFER=1
extra_scripts = pre:patch_bounce.py
lib_deps =
  lvgl/lvgl@8.3.11
  tamctec/TAMC_GT911@^1.0.2
  moononournation/GFX Library for Arduino@1.5.9
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1

; OTA target for the bounce build. Only push this after validating the bounce
; build over USB once — a display fault on a headless panel is easiest to catch
; on a cable, not blind over the network.
[env:crowpanel_7_bounce_ota]
extends = env:crowpanel_7_bounce
upload_protocol = espota
upload_flags =
  --auth=change-me

; Experiment: bounce buffers + code-in-PSRAM. custom_sdkconfig makes pioarduino
; rebuild the IDF libraries from source with these options — notably
; SPIRAM_XIP_FROM_PSRAM, which the stock precompiled libs won't expose. It runs
; .text/.rodata from PSRAM so Flash stalls can't starve the RGB bounce refill ISR
; (Espressif's documented cause of the vertical-scroll desync). First build is slow.
[env:crowpanel_7_idf]
extends = env:crowpanel_7_bounce
; CH340 on this panel is flaky above 230400 (C100 checksum / urb -71).
upload_speed = 115200
; patch_bounce enables bb_invalidate_cache; hijack_dummy repoints pioarduino's
; hello-world .dummy stub at our actual app so the from-source XIP build links it.
extra_scripts =
  pre:patch_bounce.py
  pre:hijack_dummy.py
; Explicit build_flags (NOT inheriting the bounce env's) so the core-pinning -D
; flags are simply absent — a command-line -DARDUINO_EVENT_RUNNING_CORE=0 redefines
; what the IDF-component build already sets and trips -Werror in wpa_supplicant.
; The cores are set via CONFIG_* below instead.
build_flags =
  -I include
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DDISPLAY_USE_BOUNCE_BUFFER=1
  -Wno-error
custom_sdkconfig =
  CONFIG_AUTOSTART_ARDUINO=y
  CONFIG_ARDUINO_RUNNING_CORE=1
  CONFIG_ARDUINO_EVENT_RUNNING_CORE=0
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_SPEED_80M=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
  CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
  CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
  CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
; Strip Arduino 3.x's optional cloud stack — we use none of it, and esp_insights'
; cert-embedding step breaks under PlatformIO's build (https_server.crt.S not found).
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/rmaker_common
  espressif/esp-dsp
  espressif/network_provisioning
  espressif/esp_secure_cert_mgr
  espressif/esp-sr
  espressif/esp-modbus
  espressif/esp_modem
  espressif/esp_diag_data_store
  espressif/qrcode
  espressif/fb_gfx

; OTA target for the from-source XIP/bounce build (the one in daily use). Uploads
; over WiFi via ArduinoOTA — no CH340 needed. The device's OTA password stays out
; of the repo: pass it in the OTA_PASSWORD env var. Example:
;   OTA_PASSWORD=yourpass pio run -e crowpanel_7_idf_ota -t upload \
;     --upload-port crowpanel.local
; USB-flash (crowpanel_7_idf) any DISPLAY-DRIVER change first; OTA is for UI/logic.
[env:crowpanel_7_idf_ota]
extends = env:crowpanel_7_idf
upload_protocol = espota
upload_flags =
  --auth=${sysenv.OTA_PASSWORD}
