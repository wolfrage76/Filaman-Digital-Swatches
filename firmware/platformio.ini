; ============================================================
;  One firmware tree, several boards. Shared libs live in [env];
;  each [env:<board>] adds BOARD_*, its boards/<folder>/ filter,
;  flash size, and board-only libraries. See src/boards/board.h.
; ============================================================
[platformio]
default_envs = crowpanel_7_idf

[common]
build_flags =
  -I include
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
; Every board folder is excluded here; each env adds its own back.
src_filter = +<*> -<boards/>

lib_deps_shared =
  lvgl/lvgl@8.3.11
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1

; ------------------------------------------------------------
;  CrowPanel 7" — Arduino 2.x / IDF 4.4 (no bounce buffers).
; ------------------------------------------------------------
[env:crowpanel_7_hmi]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 230400
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
build_flags =
  ${common.build_flags}
  -DBOARD_CROWPANEL_7
  -DARDUINO_RUNNING_CORE=1
  -UARDUINO_EVENT_RUNNING_CORE
  -DARDUINO_EVENT_RUNNING_CORE=0
build_src_filter = ${common.src_filter} +<boards/crowpanel_7/>
extra_scripts = pre:select_board.py
lib_deps =
  ${common.lib_deps_shared}
  tamctec/TAMC_GT911@^1.0.2
  moononournation/GFX Library for Arduino@1.4.9

[env:crowpanel_7_ota]
extends = env:crowpanel_7_hmi
upload_protocol = espota
upload_flags =
  --auth=change-me

; ------------------------------------------------------------
;  CrowPanel bounce (Arduino 3) — experimental.
; ------------------------------------------------------------
[env:crowpanel_7_bounce]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
build_flags =
  ${common.build_flags}
  -DBOARD_CROWPANEL_7
  -DARDUINO_RUNNING_CORE=1
  -UARDUINO_EVENT_RUNNING_CORE
  -DARDUINO_EVENT_RUNNING_CORE=0
  -DDISPLAY_USE_BOUNCE_BUFFER=1
build_src_filter = ${common.src_filter} +<boards/crowpanel_7/>
extra_scripts =
  pre:select_board.py
  pre:patch_bounce.py
lib_deps =
  ${common.lib_deps_shared}
  tamctec/TAMC_GT911@^1.0.2
  moononournation/GFX Library for Arduino@1.5.9

[env:crowpanel_7_bounce_ota]
extends = env:crowpanel_7_bounce
upload_protocol = espota
upload_flags =
  --auth=change-me

; ------------------------------------------------------------
;  CrowPanel daily build: bounce + SPIRAM XIP from source.
; ------------------------------------------------------------
[env:crowpanel_7_idf]
extends = env:crowpanel_7_bounce
upload_speed = 115200
extra_scripts =
  pre:select_board.py
  pre:patch_bounce.py
  pre:hijack_dummy.py
build_flags =
  ${common.build_flags}
  -DBOARD_CROWPANEL_7
  -DDISPLAY_USE_BOUNCE_BUFFER=1
  -Wno-error
build_src_filter = ${common.src_filter} +<boards/crowpanel_7/>
custom_sdkconfig =
  CONFIG_AUTOSTART_ARDUINO=y
  CONFIG_ARDUINO_RUNNING_CORE=1
  CONFIG_ARDUINO_EVENT_RUNNING_CORE=0
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_SPEED_80M=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
  CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
  CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
  CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/rmaker_common
  espressif/esp-dsp
  espressif/network_provisioning
  espressif/esp_secure_cert_mgr
  espressif/esp-sr
  espressif/esp-modbus
  espressif/esp_modem
  espressif/esp_diag_data_store
  espressif/qrcode
  espressif/fb_gfx

[env:crowpanel_7_idf_ota]
extends = env:crowpanel_7_idf
upload_protocol = espota
upload_flags =
  --auth=${sysenv.OTA_PASSWORD}

; ------------------------------------------------------------
;  Waveshare ESP32-S3-Touch-LCD-7: ESP-IDF RGB + CH422G + GT911.
;  sdkconfig matches SpoolmanScale's proven Waveshare settings.
; ------------------------------------------------------------
[env:waveshare-s3-lcd7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
build_flags =
  ${common.build_flags}
  -DBOARD_WAVESHARE_S3_LCD7
  -DDISPLAY_USE_BOUNCE_BUFFER=1
  -Wno-error
build_src_filter = ${common.src_filter} +<boards/waveshare_s3_lcd7/>
lib_deps =
  ${common.lib_deps_shared}
; No Arduino_GFX / TAMC_GT911 — panel uses esp_lcd + local gt911/ch422g.
extra_scripts =
  pre:select_board.py
  pre:hijack_dummy.py
custom_sdkconfig =
  CONFIG_AUTOSTART_ARDUINO=y
  CONFIG_ARDUINO_RUNNING_CORE=1
  CONFIG_ARDUINO_EVENT_RUNNING_CORE=0
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_SPEED_80M=y
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  '# CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set'
  '# CONFIG_LCD_RGB_RESTART_IN_VSYNC is not set'
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
  CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/rmaker_common
  espressif/esp-dsp
  espressif/network_provisioning
  espressif/esp_secure_cert_mgr
  espressif/esp-sr
  espressif/esp-modbus
  espressif/esp_modem
  espressif/esp_diag_data_store
  espressif/qrcode
  espressif/fb_gfx

[env:waveshare-s3-lcd7_ota]
extends = env:waveshare-s3-lcd7
upload_protocol = espota
upload_flags =
  --auth=${sysenv.OTA_PASSWORD}
